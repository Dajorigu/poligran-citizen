<form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
  <h2>Iniciar sesión</h2>

  <div class="field">
    <label for="l-email">Correo electrónico</label>
    <input id="l-email" type="email" formControlName="email" autocomplete="email" [attr.aria-invalid]="!!error('email')" />
    <small class="error">{{ error('email') }}</small>
  </div>

  <div class="field">
    <label for="l-pass">Contraseña</label>
    <input id="l-pass" type="password" formControlName="password" autocomplete="current-password" [attr.aria-invalid]="!!error('password')" />
    <small class="error">{{ error('password') }}</small>
  </div>

  <button class="btn-solid" type="submit">Ingresar</button>
</form>
